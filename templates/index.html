<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto Pivot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d1117; color: #e6edf3; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
    .drop-zone {
      border: 2px dashed #30363d;
      border-radius: 10px;
      padding: 60px 40px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #58a6ff;
      background: rgba(88,166,255,.06);
    }
    .drop-icon { font-size: 3rem; margin-bottom: 12px; }
    .btn-upload { background: #238636; border: none; padding: 10px 28px; border-radius: 8px; font-weight: 600; }
    .btn-upload:hover { background: #2ea043; }
    .divider { display: flex; align-items: center; gap: 12px; color: #484f58; font-size: .8rem; margin: 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #30363d; }
    .form-select {
      background: #0d1117 !important; border: 1px solid #30363d; color: #e6edf3 !important;
      border-radius: 8px; font-size: .9rem;
    }
    .form-select:focus { border-color: #58a6ff !important; box-shadow: none !important; }
    .form-select option { background: #161b22; color: #e6edf3; }
    .btn-load { background: #1f6feb; border: none; padding: 10px 28px; border-radius: 8px; font-weight: 600; }
    .btn-load:hover { background: #388bfd; }
  </style>
</head>
<body>
  <div class="container" style="max-width:520px">
    <div class="card p-4">
      <h4 class="mb-1 fw-bold text-center" style="color:#58a6ff; letter-spacing:.04em">CRYPTO PIVOT</h4>
      <p class="text-secondary text-center mb-4" style="font-size:.9rem">Upload your resolved markets CSV to view the pivot</p>

      {% if error %}
      <div class="alert alert-danger py-2 mb-3" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/upload" enctype="multipart/form-data" id="uploadForm">
        <div class="drop-zone" id="dropZone">
          <div class="drop-icon">📂</div>
          <div class="fw-semibold mb-1">Drag &amp; drop your CSV here</div>
          <div class="text-secondary mb-3" style="font-size:.85rem">or click to browse</div>
          <input type="file" name="file" id="fileInput" accept=".csv" class="d-none">
          <button type="button" class="btn btn-upload text-white" onclick="document.getElementById('fileInput').click()">Choose File</button>
          <div id="fileName" class="mt-3 text-secondary" style="font-size:.85rem"></div>
        </div>
        <button type="submit" class="btn btn-upload text-white w-100 mt-3 d-none" id="submitBtn">Upload &amp; View Pivot →</button>
      </form>

      {% if saved_files %}
      <div class="divider">or load a saved file</div>
      <div class="d-flex gap-2">
        <select class="form-select" id="savedSel">
          <option value="" disabled selected>Select a previously uploaded file…</option>
          {% for f in saved_files %}
          <option value="{{ f }}">{{ f }}</option>
          {% endfor %}
        </select>
        <button class="btn btn-load text-white" onclick="loadSaved()">Load</button>
        <form id="deleteForm" method="post" action="#">
          <button type="button" onclick="confirmDelete()" title="Delete selected file" style="background:#4a1515;border:1px solid #da3633;color:#f85149;border-radius:8px;padding:10px 12px;cursor:pointer">🗑</button>
        </form>
      </div>
      {% endif %}
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const submitBtn = document.getElementById('submitBtn');

    function setFile(file) {
      if (!file) return;
      fileName.textContent = '📄 ' + file.name;
      submitBtn.classList.remove('d-none');
    }

    fileInput.addEventListener('change', () => setFile(fileInput.files[0]));

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) {
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;
        setFile(file);
      }
    });

    function loadSaved() {
      const sel = document.getElementById('savedSel');
      if (!sel || !sel.value) { alert('Please select a file first.'); return; }
      window.location.href = '/load/' + encodeURIComponent(sel.value);
    }

    function confirmDelete() {
      const sel = document.getElementById('savedSel');
      if (!sel || !sel.value) { alert('Please select a file first.'); return; }
      if (!confirm('Delete "' + sel.value + '"? This cannot be undone.')) return;
      const form = document.getElementById('deleteForm');
      form.action = '/delete/' + encodeURIComponent(sel.value);
      form.submit();
    }
  </script>
</body>
</html>
